<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 116" width="100%" height="100%">
  <defs>
    <!-- Vibrant Rotten Cherry Gradient: Illuminated Ruby to Deep Wine -->
    <linearGradient id="cherryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#941D3C" />
      <stop offset="100%" stop-color="#4F0C1E" />
    </linearGradient>

    <!-- Soft Air Float Drop Shadow -->
    <filter id="cherryShadow" x="-12%" y="-12%" width="128%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Borderless Floating Bubble: Rotten Cherry -->
  <g transform="translate(12, 10)" filter="url(#cherryShadow)">
    <path d="
      M 19,0
      L 282,0
      C 292.45,0 301,8.55 301,19
      L 301,63
      C 301,73.45 292.45,82 282,82
      L 130,82
      C 127,88 109,92 96,95
      C 95.5,93.8 95.2,93.0 95.6,92.2
      C 99.6,85.2 106,88 108,82
      L 19,82
      C 8.55,82 0,73.45 0,63
      L 0,19
      C 0,8.55 8.55,0 19,0
      Z"
      fill="url(#cherryGrad)" />
  </g>

  <!-- Typography & Content -->
  <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" letter-spacing="-0.2">без света сидели, не очень</text>
  <text x="34" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" letter-spacing="-0.2">удобно было</text>

  <!-- Footer Row: Telegram Reaction Pill (Left) & Metadata (Right) -->
  <g transform="translate(34, 68)">
    <!-- Subtly tinted capsule matching the cherry bubble -->
    <rect width="47" height="22" rx="11" fill="rgba(0, 0, 0, 0.22)" />
    <!-- Large Expressive Heart Emoji -->
    <text x="5" y="16" font-size="14.5">❤️</text>
    <!-- Circular User Photo Avatar -->
    <g transform="translate(25, 3)">
      <circle cx="8" cy="8" r="8" fill="#5C4533" />
      <circle cx="8" cy="6" r="3.2" fill="#E2B18A" />
      <path d="M 2.5 14 C 2.5 10 5 9.5 8 9.5 C 11 9.5 13.5 10 13.5 14 Z" fill="#2E1C14" />
    </g>
  </g>

  <!-- Timestamp & Read Checkmarks (Soft Rose Accent on Cherry) -->
  <text x="238" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="rgba(255,255,255,0.65)" font-weight="500">01:29</text>
  <g transform="translate(270, 75)" fill="none" stroke="#FBCFE8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1.5 6 L 4.5 9 L 9.5 2" />
    <path d="M 7.5 6 L 10.5 9 L 15.5 2" />
  </g>
</svg>
